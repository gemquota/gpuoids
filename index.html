<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gpuoids · WebGPU Flocking</title>
  </head>
  <body>
    <div id="loader">loading...</div>
    <div class="card">
      <div class="header">
        <span class="title">Boids</span>
        <span id="fps-badge" class="fps-badge">
          <span id="fps" class="fps-value">0</span>
          <span class="fps-unit">FPS</span>
        </span>
      </div>

      <div class="row">
        <span class="row-label">View</span>
        <div class="segmented">
          <button id="view-2d" class="segment" tabindex="-1">2D</button>
          <button id="view-3d" class="segment" tabindex="-1">3D</button>
        </div>
      </div>

      <div class="row row--slider">
        <span class="row-label">Count</span>
        <span id="boid-count" class="row-value">32</span>
      </div>
      <input
        type="range"
        id="boid-slider"
        class="boid-slider"
        min="5"
        max="16"
        step="any"
        value="5"
        tabindex="-1"
      />
      <div class="slider-range">
        <span id="boid-min">32</span>
        <span id="boid-max">65,536</span>
      </div>

      <label class="row">
        <span id="predator-label" class="row-label">Mouse is predator</span>
        <input type="checkbox" id="predator-toggle" class="toggle" tabindex="-1" />
      </label>

      <section id="behavior-controls" class="behavior-controls">
        <div class="behavior-heading">Flocking behaviour</div>
        <label class="control-label" for="behavior-mode">Motion style</label>
        <select id="behavior-mode" class="behavior-select">
          <option value="0">Classic boids</option>
          <option value="1">Tight schooling</option>
          <option value="2">Vortex / milling</option>
          <option value="3">Orbiting schools</option>
          <option value="4">Dispersal / anti-flock</option>
          <option value="5">Travelling wave</option>
        </select>
        <label class="control-label" for="behavior-strength">Influence <output id="strength-value">1.00</output></label>
        <input id="behavior-strength" class="mod-slider" type="range" min="0" max="2" step="0.01" value="1" />
        <label class="control-label" for="behavior-flow">Directional drift <output id="flow-value">0.00</output></label>
        <input id="behavior-flow" class="mod-slider" type="range" min="-1" max="1" step="0.01" value="0" />
        <label class="control-label" for="behavior-pulse">Wave modulation <output id="pulse-value">0.00</output></label>
        <input id="behavior-pulse" class="mod-slider" type="range" min="0" max="1" step="0.01" value="0" />
      </section>

      <button id="benchmark-button" class="benchmark-button" type="button">Run GPU benchmark</button>
      <pre id="benchmark-results" class="benchmark-results" hidden></pre>
      <button id="copy-benchmark" class="benchmark-button benchmark-copy" type="button" hidden>Copy benchmark results</button>
      <div id="hint" class="hint">Drag to pan · Pinch to zoom</div>
    </div>
    <a
      href="https://github.com/gemquota/gpuoids"
      target="_blank"
      rel="noopener noreferrer"
      id="sourceButton"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 640 512"
        aria-hidden="true"
      >
        <!--! Font Awesome Pro 6.4.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license (Commercial License) Copyright 2023 Fonticons, Inc. -->
        <path
          d="M392.8 1.2c-17-4.9-34.7 5-39.6 22l-128 448c-4.9 17 5 34.7 22 39.6s34.7-5 39.6-22l128-448c4.9-17-5-34.7-22-39.6zm80.6 120.1c-12.5 12.5-12.5 32.8 0 45.3L562.7 256l-89.4 89.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0l112-112c12.5-12.5 12.5-32.8 0-45.3l-112-112c-12.5-12.5-32.8-12.5-45.3 0zm-306.7 0c-12.5-12.5-32.8-12.5-45.3 0l-112 112c-12.5 12.5-12.5 32.8 0 45.3l112 112c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L77.3 256l89.4-89.4c12.5-12.5 12.5-32.8 0-45.3z"
        />
      </svg>
      <span>View source</span>
    </a>
    <canvas id="renderCanvas"></canvas>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
