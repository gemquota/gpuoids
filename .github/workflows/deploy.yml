name: Build and deploy baseline + gpuoids

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout improved implementation
        uses: actions/checkout@v4
        with:
          ref: main
          path: improved

      - name: Checkout benchmark baseline
        uses: actions/checkout@v4
        with:
          ref: baseline
          path: baseline

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            improved/package-lock.json
            baseline/package-lock.json

      - name: Build baseline
        working-directory: baseline
        run: |
          npm ci
          npm run build -- --base=/gpuoids/baseline/

      - name: Build improved version
        working-directory: improved
        run: |
          npm ci
          npm run build -- --base=/gpuoids/

      - name: Combine Pages artifacts
        run: |
          mkdir -p improved/dist/baseline
          cp -R baseline/dist/. improved/dist/baseline/

      - name: Install Chromium benchmark runner
        id: playwright-install
        working-directory: improved
        continue-on-error: true
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps

      - name: Run baseline vs improved WebGPU benchmark
        if: steps.playwright-install.outcome == 'success'
        working-directory: improved
        continue-on-error: true
        env:
          BENCHMARK_MAX: 131072
        run: |
          mkdir -p "$RUNNER_TEMP/gpuoids-preview"
          ln -s "$GITHUB_WORKSPACE/improved/dist" "$RUNNER_TEMP/gpuoids-preview/gpuoids"
          python3 -m http.server 4173 --directory "$RUNNER_TEMP/gpuoids-preview" > "$RUNNER_TEMP/gpuoids-http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          node scripts/benchmark.mjs

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpuoids-benchmark-report
          path: improved/benchmark-results.json
          if-no-files-found: warn

      - uses: actions/upload-pages-artifact@v3
        with:
          path: improved/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
