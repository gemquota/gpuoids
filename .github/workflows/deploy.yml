name: Build and deploy baseline + gpuoids

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout improved implementation
        uses: actions/checkout@v4
        with:
          ref: main
          path: improved

      - name: Checkout benchmark baseline
        uses: actions/checkout@v4
        with:
          ref: baseline
          path: baseline

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            improved/package-lock.json
            baseline/package-lock.json

      - name: Build baseline
        working-directory: baseline
        run: |
          npm ci
          npm run build -- --base=/gpuoids/baseline/

      - name: Build improved version
        working-directory: improved
        run: |
          npm ci
          npm run build -- --base=/gpuoids/

      - name: Combine Pages artifacts
        run: |
          mkdir -p improved/dist/baseline
          cp -R baseline/dist/. improved/dist/baseline/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: improved/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
